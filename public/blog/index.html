<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <title>Blog — Ch4rybd3</title>
  <meta name="viewport" content="width=1440"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="/colors_and_type.css"/>
  <link rel="stylesheet" href="/marketing.css"/>
  <style>
    body { background: var(--htb-space); }
    .blog-header { padding: 80px 80px 48px; border-bottom: 1px solid var(--htb-line); }
    .blog-header .eyebrow { font-family: var(--font-mono); font-size: var(--fs-eyebrow); color: var(--htb-green); text-transform: uppercase; letter-spacing: .15em; margin-bottom: 12px; }
    .blog-header h1 { font-family: var(--font-display); font-size: var(--fs-h1); font-weight: 800; color: var(--htb-fg); }
    .blog-header p  { color: var(--htb-fg-3); margin-top: 10px; font-size: var(--fs-body); }

    .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; padding: 48px 80px; }

    .article-card {
      background: var(--htb-card);
      border: 1px solid var(--htb-line);
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      transition: border-color .2s, transform .2s;
      display: flex; flex-direction: column;
    }
    .article-card:hover { border-color: var(--htb-line-2); transform: translateY(-2px); }
    .article-card .cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--htb-card-3); }
    .article-card .cover-placeholder {
      width: 100%; aspect-ratio: 16/9;
      background: var(--htb-card-3); display: flex; align-items: center; justify-content: center;
      color: var(--htb-fg-4); font-size: 32px;
    }
    .article-card .body { padding: 20px 22px; flex: 1; display: flex; flex-direction: column; }
    .article-card .tag { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--htb-green); margin-bottom: 8px; }
    .article-card h2 { font-size: 17px; font-weight: 700; color: var(--htb-fg); line-height: 1.3; margin-bottom: 8px; }
    .article-card .excerpt { font-size: 13px; color: var(--htb-fg-3); line-height: 1.6; flex: 1; }
    .article-card .meta { font-size: 11px; color: var(--htb-fg-4); margin-top: 16px; font-family: var(--font-mono); }

    .empty-state { padding: 80px; text-align: center; color: var(--htb-fg-4); grid-column: 1/-1; }
    .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; }

    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--htb-fg-3); text-decoration: none; font-size: 13px; padding: 80px 80px 0; }
    .back-link:hover { color: var(--htb-green); }
  </style>
</head>
<body>
  <a href="/" class="back-link"><i class="fa fa-arrow-left"></i> Portfolio</a>
  <div class="blog-header">
    <div class="eyebrow">// writings</div>
    <h1>Blog</h1>
    <p>Articles sur la cybersécurité, le DFIR, la CTI et la vie de SOC analyst.</p>
  </div>
  <div class="blog-grid" id="blogGrid">
    <div class="empty-state"><i class="fa fa-spinner fa-spin"></i> Chargement…</div>
  </div>
  <script>
    fetch('/api/articles').then(r => r.json()).then(articles => {
      const grid = document.getElementById('blogGrid')
      if (!articles.length) {
        grid.innerHTML = '<div class="empty-state"><i class="fa fa-pen-nib"></i>Aucun article pour le moment.</div>'
        return
      }
      grid.innerHTML = articles.map(a => `
        <a href="/blog/${a.slug}" class="article-card">
          ${a.cover_image
            ? `<img class="cover" src="${a.cover_image}" alt="${esc(a.title)}" loading="lazy"/>`
            : `<div class="cover-placeholder"><i class="fa fa-file-lines"></i></div>`}
          <div class="body">
            <div class="tag">Article</div>
            <h2>${esc(a.title)}</h2>
            ${a.excerpt ? `<p class="excerpt">${esc(a.excerpt)}</p>` : ''}
            <div class="meta">${fmtDate(a.published_at)}</div>
          </div>
        </a>
      `).join('')
    }).catch(() => {
      document.getElementById('blogGrid').innerHTML = '<div class="empty-state"><i class="fa fa-triangle-exclamation"></i> Erreur de chargement</div>'
    })
    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
    function fmtDate(d) { return d ? new Date(d).toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' }) : '' }
  </script>
</body>
</html>
