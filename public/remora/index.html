  <style>
    :root { --p-cyan: #5CB3FF; --docs-sidebar: 268px; }
    body { background: #0A1018; overflow-x: hidden; }

    .mk-nav { padding-left: 24px; }

    .docs-layout {
      display: flex;
      min-height: calc(100vh - 64px);
      padding-top: 64px;
    }

    /* ── Left sidebar ── */
    .docs-sidebar {
      position: fixed;
      top: 64px; left: 0; bottom: 0;
      width: var(--docs-sidebar);
      background: #0D1524;
      border-right: 1px solid var(--htb-line);
      display: flex; flex-direction: column;
      z-index: 20;
      overflow: hidden;
    }
    .docs-sidebar-head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--htb-line);
      flex-shrink: 0;
    }
    .docs-sidebar-brand {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-display); font-weight: 700; font-size: 13px;
      color: var(--htb-green); text-transform: uppercase; letter-spacing: .08em;
      margin-bottom: 10px;
    }
    .docs-search-wrap { position: relative; }
    .docs-search {
      width: 100%; background: var(--htb-card-3); border: 1px solid var(--htb-line-2);

      transition: border-color .15s;
    }
    .docs-search:focus { border-color: var(--htb-green); }
    .docs-search-icon {
      position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
      color: var(--htb-fg-4); font-size: 12px; pointer-events: none;
    }
    .docs-search::placeholder { color: var(--htb-fg-4); }

    /* Tree */
    .docs-tree { flex: 1; overflow-y: auto; padding: 8px 0 24px; }
    .docs-tree::-webkit-scrollbar { width: 4px; }
    .docs-tree::-webkit-scrollbar-track { background: transparent; }
    .docs-tree::-webkit-scrollbar-thumb { background: var(--htb-line-2); border-radius: 2px; }

    .tree-ul { list-style: none; padding: 0; margin: 0; }
    .tree-ul .tree-ul { padding-left: 14px; }

    .tree-folder-head {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 16px 5px 12px; cursor: pointer;
      font-family: var(--font-mono); font-size: 11px; font-weight: 600;
      color: var(--htb-fg-3); letter-spacing: .05em; text-transform: uppercase;
      user-select: none; transition: color .15s, background .15s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tree-folder-head:hover { color: var(--htb-fg); background: rgba(255,255,255,.03); }
    .tree-folder-head .fa-chevron-right { font-size: 9px; color: var(--htb-fg-4); transition: transform .2s; flex-shrink: 0; }
    .tree-folder-head .fa-folder, .tree-folder-head .fa-folder-open { font-size: 12px; color: var(--htb-fg-4); flex-shrink: 0; }
    .tree-folder.open > .tree-folder-head .fa-chevron-right { transform: rotate(90deg); }
    .tree-folder > .tree-ul { display: none; }
    .tree-folder.open > .tree-ul { display: block; }

    .tree-note {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 16px 5px 20px; cursor: pointer;
      font-size: 13px; color: var(--htb-fg-3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color .15s, background .15s; border-left: 2px solid transparent;
      margin-left: 2px;
    }
    .tree-note .fa-file-lines { font-size: 11px; color: var(--htb-fg-4); flex-shrink: 0; }
    .tree-note:hover { color: var(--htb-fg); background: rgba(255,255,255,.03); }
    .tree-note.active { color: var(--htb-green); border-left-color: var(--htb-green); background: rgba(45,212,191,.04); }

    .tree-empty { padding: 16px 16px; font-size: 12px; color: var(--htb-fg-4); font-family: var(--font-mono); }

    /* ── Image lightbox ── */
    .docs-body img { cursor: zoom-in; }
    .img-lightbox {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(4, 9, 16, .93);
      display: none; align-items: center; justify-content: center;
      overflow: auto; cursor: zoom-out; padding: 24px;

    .img-lightbox.open { display: flex; }
    .img-lightbox img {

    .img-lightbox img.zoomable { cursor: zoom-in; }
    .img-lightbox.zoomed img.zoomable { cursor: zoom-out; }
    .img-lightbox-hint {

    .docs-body th { background: var(--htb-card-2); padding: 10px 14px; text-align: left; color: var(--htb-fg); font-weight: 600; border-bottom: 2px solid var(--htb-line); }
    .docs-body td { padding: 9px 14px; border-bottom: 1px solid var(--htb-line); }
    .docs-body tr:hover td { background: rgba(255,255,255,.02); }

    .docs-body img { max-width: 100%; border-radius: 8px; margin: .5em 0; }
    .docs-body hr { border: none; border-top: 1px solid var(--htb-line); margin: 2em 0; }

    .docs-body strong { color: var(--htb-fg); font-weight: 700; }
    .docs-body em { color: var(--htb-fg-2); }

    /* Callout blocks */
    .callout {
      border-radius: 8px; margin: 1em 0; overflow: hidden;
      border: 1px solid;
    }
    .callout-title {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 16px; font-size: 13px; font-weight: 700;
      font-family: var(--font-mono); letter-spacing: .04em; text-transform: uppercase;

    .callout-body { padding: 10px 16px; font-size: 14px; line-height: 1.65; }
    .callout-body > p:last-child { margin-bottom: 0; }

    .callout-note    { background: rgba(92,179,255,.04);  border-color: rgba(92,179,255,.25); }

    .callout-tip     { background: rgba(45,212,191,.04);   border-color: rgba(45,212,191,.25); }

    .callout-warning { background: rgba(255,175,0,.04);   border-color: rgba(255,175,0,.25); }
    .callout-warning .callout-title { background: rgba(255,175,0,.08);   color: var(--htb-warning); }
    .callout-danger  { background: rgba(255,62,62,.04);   border-color: rgba(255,62,62,.25); }
    .callout-danger .callout-title  { background: rgba(255,62,62,.08);   color: var(--htb-danger); }
    .callout-info    { background: rgba(92,179,255,.04);  border-color: rgba(92,179,255,.25); }
    .callout-info .callout-title    { background: rgba(92,179,255,.08);  color: var(--p-cyan); }
    .callout-important { background: rgba(255,175,0,.04); border-color: rgba(255,175,0,.25); }
    .callout-important .callout-title { background: rgba(255,175,0,.08); color: var(--htb-warning); }

    .docs-loading { padding: 48px; color: var(--htb-fg-4); font-family: var(--font-mono); font-size: 13px; }

    .tree-note.hidden, .tree-folder.hidden { display: none; }

<script>
/* ════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════ */
let allNotes = []
let notesByTitle = new Map()
let notesByPath  = new Map()

/* ════════════════════════════════════════════════
   MARKED SETUP
════════════════════════════════════════════════ */
function setupMarked() {
  const renderer = new marked.Renderer()

  renderer.code = function(token) {
    const code = typeof token === 'object' ? token.text : token
    const lang = typeof token === 'object' ? token.lang : arguments[1]
    const language = (lang && hljs.getLanguage(lang)) ? lang : 'plaintext'
    try {
      const highlighted = hljs.highlight(code, { language }).value
      const label = lang ? `<span class="code-lang">${lang}</span>` : ''
      return `<div class="code-block">${label}<pre><code class="hljs language-${language}">${highlighted}</code></pre></div>`
    } catch {
      return `<pre><code>${code.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</code></pre>`
    }
  }

  renderer.image = function(token) {
    const href = typeof token === 'object' ? token.href : token
    const text = typeof token === 'object' ? token.text : arguments[2]
    return `<img src="${href}" alt="${text||''}" loading="lazy"/>`
  }

  marked.use({ renderer, gfm: true, breaks: true })
}

/* ════════════════════════════════════════════════
   CALLOUT POST-PROCESS
════════════════════════════════════════════════ */
const CALLOUT_ICONS = {
  note: 'fa-circle-info', tip: 'fa-lightbulb', warning: 'fa-triangle-exclamation',
  danger: 'fa-circle-exclamation', info: 'fa-circle-info', important: 'fa-star'
}
function postProcess(html) {
  return html.replace(
    /<blockquote>\s*<p>\[!(NOTE|TIP|WARNING|DANGER|INFO|IMPORTANT)\](.*?)<\/p>([\s\S]*?)<\/blockquote>/gi,
    (_, type, titleRaw, body) => {
      const t = type.toLowerCase()
      const title = titleRaw.trim() || type.toUpperCase()
      const icon = CALLOUT_ICONS[t] || 'fa-circle-info'
      return `<div class="callout callout-${t}"><div class="callout-title"><i class="fa fa-fw ${icon}"></i>${title}</div><div class="callout-body">${body}</div></div>`
    }
  )
}

function renderMarkdown(content) {
  return postProcess(marked.parse(content || ''))
}

/* ════════════════════════════════════════════════
   TREE BUILD & RENDER
════════════════════════════════════════════════ */
function buildTree(notes) {
  const root = { _notes: [], _folders: {} }
  notes.forEach(note => {
    const parts = note.path.split('/')
    let node = root
    for (let i = 0; i < parts.length - 1; i++) {
      const f = parts[i]
      if (!node._folders[f]) node._folders[f] = { _notes: [], _folders: {} }
      node = node._folders[f]
    }
    node._notes.push(note)
  })
  return root
}

function formatFolder(name) {
  return name.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())
}

function renderTreeNode(node, level) {
  const ul = document.createElement('ul')
  ul.className = 'tree-ul'

  Object.entries(node._folders).sort(([a],[b]) => a.localeCompare(b)).forEach(([name, child]) => {
    const li = document.createElement('li')
    li.className = 'tree-folder open'
    li.dataset.folder = name

    const head = document.createElement('div')
    head.className = 'tree-folder-head'
    head.innerHTML = `<i class="fa fa-chevron-right"></i><i class="fa fa-folder-open"></i><span>${formatFolder(name)}</span>`
    head.addEventListener('click', () => {
      li.classList.toggle('open')
      head.querySelector('.fa-folder-open, .fa-folder').className = li.classList.contains('open') ? 'fa fa-folder-open' : 'fa fa-folder'
    })

    li.appendChild(head)
    li.appendChild(renderTreeNode(child, level + 1))
    ul.appendChild(li)
  })

  node._notes.slice().sort((a,b) => a.title.localeCompare(b.title)).forEach(note => {
    const li = document.createElement('li')
    li.className = 'tree-note'
    li.dataset.path = note.path
    li.innerHTML = `<i class="fa fa-file-lines"></i><span>${note.title}</span>`
    li.addEventListener('click', () => navigate(note.path))
    ul.appendChild(li)
  })

  return ul
}

function renderTree(notes) {
  const tree = buildTree(notes)
  const container = document.getElementById('docsTree')
  container.innerHTML = ''

  if (!notes.length) {
    container.innerHTML = '<div class="tree-empty">No published pages.</div>'
    return
  }

  container.appendChild(renderTreeNode(tree, 0))
}

/* ════════════════════════════════════════════════
   NAVIGATION & RENDERING
════════════════════════════════════════════════ */
function setActiveNote(path) {
  document.querySelectorAll('.tree-note.active').forEach(el => el.classList.remove('active'))
  const el = document.querySelector(`.tree-note[data-path="${CSS.escape(path)}"]`)
  if (el) {
    el.classList.add('active')
    let parent = el.parentElement
    while (parent) {
      if (parent.classList.contains('tree-folder')) {
        parent.classList.add('open')
        const icon = parent.querySelector('.fa-folder, .fa-folder-open')
        if (icon) icon.className = 'fa fa-folder-open'
      }
      parent = parent.parentElement
    }
  }
}

function renderBreadcrumb(notePath) {
  const bc = document.getElementById('docsBreadcrumb')
  const parts = notePath.split('/')
  const items = [{ label: 'Remora', path: null }]
  let built = ''
  parts.forEach((p, i) => {
    built += (i ? '/' : '') + p
    items.push({ label: formatFolder(p), path: i === parts.length - 1 ? built : null })
  })
  bc.innerHTML = items.map((item, i) => {
    const isLast = i === items.length - 1
    const el = item.path && !isLast
      ? `<a onclick="navigate('${item.path}');return false" href="/remora/${item.path}">${item.label}</a>`
      : `<span style="color:var(--htb-fg)">${item.label}</span>`
    return i > 0 ? `<span class="docs-breadcrumb-sep">/</span>${el}` : el
  }).join('')
  bc.style.display = 'flex'
}

async function navigate(notePath) {
  if (!notePath) { showWelcome(); return }

  document.getElementById('docsWelcome').style.display = 'none'
  document.getElementById('docsArticle').style.display = 'none'
  document.getElementById('noteBody').innerHTML = '<div class="docs-loading"><i class="fa fa-spinner fa-spin"></i> Loading…</div>'
  document.getElementById('docsArticle').style.display = 'block'

  history.pushState({ notePath }, '', `/remora/${notePath}`)
  setActiveNote(notePath)
  renderBreadcrumb(notePath)

  try {
    const res = await fetch(`/api/remora/note/${notePath}`)
    if (!res.ok) { showError(notePath); return }
    const note = await res.json()
    renderNote(note)
  } catch {
    showError(notePath)
  }
}

function renderNote(note) {
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  const tags = (note.properties?.tags || [])
  document.getElementById('noteTags').innerHTML = tags.map(t =>
    `<span class="note-tag">${esc(t)}</span>`
  ).join('')

  const updated = note.updated_at ? new Date(note.updated_at).toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' }) : ''
  document.getElementById('noteMeta').textContent = updated ? `Updated ${updated}` : ''

  document.getElementById('noteBody').innerHTML = DOMPurify.sanitize(renderMarkdown(note.content))
  document.getElementById('docsWelcome').style.display = 'none'
  document.getElementById('docsArticle').style.display = 'block'

  window.scrollTo({ top: 0, behavior: 'smooth' })
}

function showWelcome() {
  document.getElementById('docsWelcome').style.display = 'block'
  document.getElementById('docsArticle').style.display = 'none'
  document.getElementById('docsBreadcrumb').style.display = 'none'
  history.pushState({}, '', '/remora')
  document.querySelectorAll('.tree-note.active').forEach(el => el.classList.remove('active'))
}

function showError(path) {
  document.getElementById('noteBody').innerHTML = `<div style="color:var(--htb-fg-3);font-family:var(--font-mono);font-size:13px;padding:16px 0"><i class="fa fa-triangle-exclamation" style="color:var(--htb-warning);margin-right:8px"></i>Page not found: <code>${path}</code></div>`
}

/* ════════════════════════════════════════════════
   SEARCH
════════════════════════════════════════════════ */
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim()
  if (!q) {
    document.querySelectorAll('.tree-note, .tree-folder').forEach(el => el.classList.remove('hidden'))
    return
  }
  document.querySelectorAll('.tree-note').forEach(el => {
    const title = el.querySelector('span')?.textContent.toLowerCase() || ''
    const path  = el.dataset.path?.toLowerCase() || ''
    el.classList.toggle('hidden', !title.includes(q) && !path.includes(q))
  })
  document.querySelectorAll('.tree-folder').forEach(folder => {
    const visible = [...folder.querySelectorAll('.tree-note')].some(n => !n.classList.contains('hidden'))
    folder.classList.toggle('hidden', !visible)
    if (!folder.classList.contains('hidden')) folder.classList.add('open')
  })
})

/* ════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════ */
async function init() {
  setupMarked()

  try {
    const res = await fetch('/api/remora')
    allNotes = await res.json()
    notesByTitle = new Map(allNotes.map(n => [n.title.toLowerCase(), n]))
    notesByPath  = new Map(allNotes.map(n => [n.path, n]))
  } catch {
    allNotes = []
  }

  renderTree(allNotes)

  const urlPath = location.pathname.replace(/^\/remora\/?/, '').trim()
  if (urlPath) {
    navigate(urlPath)
  } else if (allNotes.find(n => n.path === 'getting-started')) {
    navigate('getting-started')
  }
}

window.addEventListener('popstate', () => {
  const urlPath = location.pathname.replace(/^\/remora\/?/, '').trim()
  if (urlPath) navigate(urlPath)
  else showWelcome()
})

init()

/* ════════ Image lightbox ════════ */
const lightbox = document.createElement('div')
lightbox.className = 'img-lightbox'
lightbox.innerHTML = '<img alt=""/><div class="img-lightbox-hint">click image to zoom · click outside or Esc to close</div>'
document.body.appendChild(lightbox)
const lightboxImg = lightbox.querySelector('img')

function closeLightbox() {
  lightbox.classList.remove('open', 'zoomed')
  document.body.style.overflow = ''
}

document.getElementById('noteBody').addEventListener('click', e => {
  const img = e.target.closest('img')
  if (!img || !img.src) return
  lightboxImg.src = img.src
  lightboxImg.alt = img.alt || ''
  lightbox.classList.add('open')
  lightbox.classList.remove('zoomed')
  document.body.style.overflow = 'hidden'
  // Le zoom 1:1 n'a d'intérêt que si l'image dépasse la taille affichée
  const updateZoomable = () => lightboxImg.classList.toggle('zoomable', lightboxImg.naturalWidth > lightboxImg.clientWidth + 8)
  if (lightboxImg.complete) updateZoomable()
  else lightboxImg.addEventListener('load', updateZoomable, { once: true })
})

lightbox.addEventListener('click', e => {
  if (e.target === lightboxImg && lightboxImg.classList.contains('zoomable')) {
    lightbox.classList.toggle('zoomed')
    return
  }
  closeLightbox()
})

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox()
})

</script>
