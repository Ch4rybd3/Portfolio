<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <title>Admin — Sécurité</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="./src/style.css"/>
  <style>
    .security-card {
      max-width: 460px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; overflow: hidden;
    }
    .security-card-header {
      padding: 18px 24px; border-bottom: 1px solid var(--line);
      background: var(--deep);
      display: flex; align-items: center; gap: 10px;
    }
    .security-card-icon {
      width: 34px; height: 34px; border-radius: 8px;
      background: rgba(45,212,191,.1); border: 1px solid rgba(45,212,191,.2);
      display: flex; align-items: center; justify-content: center;
      color: var(--green); font-size: 14px; flex-shrink: 0;
    }
    .security-card-title { font-size: 15px; font-weight: 700; color: var(--fg); }
    .security-card-sub   { font-size: 12px; color: var(--fg-4); margin-top: 1px; }
    .security-card-body  { padding: 24px; display: flex; flex-direction: column; gap: 16px; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--fg-3); }
    .field input {
      background: var(--card-3); border: 1px solid var(--line-2);
      border-radius: 6px; color: var(--fg); font-size: 14px;
      padding: 9px 12px; outline: none; transition: border-color .15s; width: 100%;
    }
    .field input:focus { border-color: var(--green); }

    /* Policy checklist */
    .policy-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      padding: 12px 14px; background: var(--card-3);
      border: 1px solid var(--line); border-radius: 8px;
    }
    .policy-rule {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--fg-4); transition: color .15s;
    }
    .policy-rule.ok { color: var(--green); }
    .policy-rule .fa { font-size: 11px; width: 13px; flex-shrink: 0; }

    .form-error {
      font-size: 12px; color: var(--danger);
      min-height: 18px; padding: 0 2px;
    }
    .security-card-footer {
      padding: 0 24px 24px;
      display: flex; justify-content: flex-end;
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">Ch4rybd3 / Admin</div>
    <nav>
      <a href="/admin"><i class="fa fa-newspaper fa-fw"></i> Articles</a>
      <a href="/admin/editor"><i class="fa fa-pen-to-square fa-fw"></i> Éditeur</a>
      <a href="/admin/kanban"><i class="fa fa-table-columns fa-fw"></i> Kanban</a>
      <a href="/admin/config"><i class="fa fa-sliders fa-fw"></i> Site Config</a>
      <a href="/admin/docs"><i class="fa fa-book fa-fw"></i> Knowledge Base</a>
      <a href="/admin/remora"><i class="fa fa-fish fa-fw"></i> Remora</a>
      <a href="/admin/security" class="active"><i class="fa fa-shield-halved fa-fw"></i> Sécurité</a>
    </nav>
    <div class="bottom">
      <button class="btn btn-ghost btn-sm" id="logoutBtn" style="width:100%;justify-content:center;">
        <i class="fa fa-right-from-bracket"></i> Déconnexion
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1>Sécurité</h1>
    </div>
    <div class="content">
      <div class="security-card">
        <div class="security-card-header">
          <div class="security-card-icon"><i class="fa fa-key"></i></div>
          <div>
            <div class="security-card-title">Changer le mot de passe</div>
            <div class="security-card-sub">Politique : 8 car. min · maj · min · chiffre · spécial</div>
          </div>
        </div>
        <div class="security-card-body">
          <div class="field">
            <label for="currentPwd">Mot de passe actuel</label>
            <input type="password" id="currentPwd" autocomplete="current-password" placeholder="••••••••"/>
          </div>
          <div class="field">
            <label for="newPwd">Nouveau mot de passe</label>
            <input type="password" id="newPwd" autocomplete="new-password" placeholder="••••••••"/>
          </div>
          <div class="policy-grid">
            <div class="policy-rule" id="rule-len"><i class="fa fa-circle"></i> 8 caractères min.</div>
            <div class="policy-rule" id="rule-upper"><i class="fa fa-circle"></i> Majuscule (A–Z)</div>
            <div class="policy-rule" id="rule-lower"><i class="fa fa-circle"></i> Minuscule (a–z)</div>
            <div class="policy-rule" id="rule-digit"><i class="fa fa-circle"></i> Chiffre (0–9)</div>
            <div class="policy-rule" id="rule-special"><i class="fa fa-circle"></i> Caractère spécial</div>
          </div>
          <div class="field">
            <label for="confirmPwd">Confirmer le nouveau mot de passe</label>
            <input type="password" id="confirmPwd" autocomplete="new-password" placeholder="••••••••"/>
          </div>
          <div class="form-error" id="formError"></div>
        </div>
        <div class="security-card-footer">
          <button class="btn btn-primary" id="submitBtn">
            <i class="fa fa-floppy-disk"></i> Enregistrer
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="./src/security.js"></script>
</body>
</html>
