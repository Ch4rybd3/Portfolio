# Derrière un tunnel Cloudflare, cloudflared transmet X-Forwarded-Proto: https ;
# on le propage tel quel, sinon (accès direct) on retombe sur le schéma local.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Redirection HTTPS : seulement si la requête vient de Cloudflare (CF-Ray présent)
# en HTTP — l'accès local direct (dev, dépannage) reste en HTTP sans redirection.
map "$http_cf_ray:$http_x_forwarded_proto" $need_https_redirect {
    default      0;
    "~^.+:http$" 1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Cloudflare real IP
    real_ip_header CF-Connecting-IP;

    if ($need_https_redirect) {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass         http://app:${APP_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }
}
