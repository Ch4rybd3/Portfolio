services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./doc-uploads:/app/doc-uploads
      - ./public:/app/public:ro
    expose:
      - "${PORT:-3000}"
    depends_on: []

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_PORT=${PORT:-3000}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      # BIND_ADDR : interface d'écoute sur l'hôte (0.0.0.0 = toutes, 127.0.0.1 = localhost seul)
      # HTTP_PORT : port public sur l'hôte
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    depends_on:
      - app

  # Tunnel Cloudflare — activé uniquement avec COMPOSE_PROFILES=tunnel dans le .env
  # (aucun port à ouvrir : cloudflared joint nginx via le réseau Docker interne)
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - nginx
