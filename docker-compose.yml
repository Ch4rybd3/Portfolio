services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./doc-uploads:/app/doc-uploads
      - ./public:/app/public:ro
    expose:
      - "${PORT:-3000}"
    depends_on: []

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_PORT=${PORT:-3000}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8080:80"
    depends_on:
      - app
